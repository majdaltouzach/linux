name: Build and Release Kernel Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use for kernel build'
        required: true
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies (ubuntu-latest)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'ubuntu-latest' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev dwarves \
            fakeroot cpio zstd

      - name: Install build dependencies (self-hosted/Arch)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner == 'self-hosted' }}
        run: |
          sudo pacman -Sy --noconfirm --needed \
            base-devel bc flex bison openssl libelf pahole

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-

      - name: Build kernel packages
        run: |
          mkdir -p /tmp/kernel-pkg
          PKGDEST=/tmp/kernel-pkg MAKEFLAGS="-j$(nproc)" \
            CC="ccache gcc" \
            makepkg --nodeps --nocheck --skipinteg --force
        working-directory: ${{ github.workspace }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/kernel-pkg/linux-jarvisos-*.pkg.tar.zst
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}